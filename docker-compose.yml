services:
  backend:
    build: .
    container_name: hr-backend
    ports:
      - "3000:3000"
 
  nginx:
    image: nginx:latest
    container_name: hr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
 